<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XProfile - My Virtual Profile Card</title>
        <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="profile-box">
        <nav class="nav">
            <img src="/assets/menu.png" alt="Menu" class="menu-icon">
            <img src="/assets/setting.png" alt="Settings" class="setting-icon">
        </nav>
        <main class="main">
        <div class="download"><img src="/assets/download.png" alt="Profile Picture"></div>
        <div>
        <h3>Learner Beaver</h3>
        <p>Frontend Dev at CrioDo, Bengaluru</p>
        </div>
        </main>
        <div class="social-media">
            <a href="https://www.instagram.com" target="_blank" aria-label="Instagram"><img src="/assets/instagram.png" alt="Instagram" width="20px"></a>
            <a href="https://telegram.org" target="_blank" aria-label="Telegram"><img src="/assets/telegram.png" alt="Telegram" width="20px"></a>
            <a href="https://dribbble.com" target="_blank" aria-label="Dribble"><img src="/assets/dribble.png" alt="Dribble" width="20px"></a>
        </div>
    </div>
</body>
</html>
